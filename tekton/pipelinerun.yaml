apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ci-cd-pipeline-run-
  namespace: cicd
spec:
  serviceAccountName: pipeline-sa
  pipelineRef:
    name: ci-cd-pipeline
  params:
    - name: repo-url
      value: https://github.com/<your-org>/<your-repo>.git
    - name: revision
      value: main
    - name: image
      value: docker.io/<your-dockerhub-user>/devops-demo-app:latest
    - name: sonar-host-url
      value: https://sonarcloud.io
    - name: sonar-project-key
      value: my-org_devops-pipeline-demo
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: shared-workspace-pvc
