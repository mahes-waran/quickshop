# Exposes the EventListener publicly so GitHub can reach it via webhook.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-listener-ingress
  namespace: cicd
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: tekton-webhook.<your-domain-or-nip.io>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: el-github-listener
                port:
                  number: 8080
  tls:
    - hosts:
        - tekton-webhook.<your-domain-or-nip.io>
      secretName: tekton-webhook-tls
