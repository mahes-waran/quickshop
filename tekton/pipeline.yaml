apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci-cd-pipeline
  namespace: cicd
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
    - name: image
      type: string
      description: e.g. docker.io/myorg/myapp:latest
    - name: sonar-host-url
      type: string
    - name: sonar-project-key
      type: string
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
        kind: ClusterTask   # from Tekton Hub catalog; install separately (see docs)
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)

    - name: code-quality-scan
      runAfter: ["fetch-source"]
      taskRef:
        name: sonarqube-scan
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: SONAR_HOST_URL
          value: $(params.sonar-host-url)
        - name: SONAR_PROJECT_KEY
          value: $(params.sonar-project-key)

    - name: build-and-push
      runAfter: ["code-quality-scan"]
      taskRef:
        name: build-and-push
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: $(params.image)

    - name: vulnerability-scan
      runAfter: ["build-and-push"]
      taskRef:
        name: trivy-scan
      params:
        - name: IMAGE
          value: $(params.image)

    - name: deploy
      runAfter: ["vulnerability-scan"]
      taskRef:
        name: deploy-to-k8s
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: $(params.image)
