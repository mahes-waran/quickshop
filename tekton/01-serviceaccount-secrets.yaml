# --- Git credentials (GitHub PAT) used by git-clone task ---
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  namespace: cicd
  annotations:
    tekton.dev/git-0: https://github.com
type: kubernetes.io/basic-auth
stringData:
  username: <GITHUB_USERNAME>
  password: <GITHUB_PERSONAL_ACCESS_TOKEN>
---
# --- Container registry credentials (e.g. Docker Hub free tier) ---
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: cicd
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"https://index.docker.io/v1/":{"username":"<REGISTRY_USER>","password":"<REGISTRY_PASSWORD_OR_TOKEN>","auth":"<BASE64_USER:PASSWORD>"}}}
---
# --- SonarQube token (SonarCloud or self-hosted SonarQube) ---
apiVersion: v1
kind: Secret
metadata:
  name: sonar-credentials
  namespace: cicd
type: Opaque
stringData:
  sonar-token: <SONARQUBE_OR_SONARCLOUD_TOKEN>
---
# --- Kubeconfig used by the deploy task to reach the target cluster ---
apiVersion: v1
kind: Secret
metadata:
  name: kubeconfig-secret
  namespace: cicd
type: Opaque
stringData:
  kubeconfig: |
    # paste your target cluster's kubeconfig content here
---
# --- GitHub webhook shared secret, validated by the Tekton Trigger interceptor ---
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  namespace: cicd
type: Opaque
stringData:
  secretToken: <RANDOM_LONG_STRING>
---
# --- ServiceAccount used by all TaskRuns/PipelineRuns ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-sa
  namespace: cicd
secrets:
  - name: git-credentials
imagePullSecrets:
  - name: registry-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-sa-edit
  namespace: cicd
subjects:
  - kind: ServiceAccount
    name: pipeline-sa
    namespace: cicd
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
