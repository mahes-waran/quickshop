# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/ecommerce?currentSchema=user_mgmt
spring.datasource.username=postgres
spring.datasource.password=postgres
#sping.datasource.schema=user_mgmt
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool (Dev scale)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OAuth2 Resource Server (e.g., Keycloak / Auth0 / Okta)
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/dev-realm
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/dev-realm/protocol/openid-connect/certs

# Spring Security OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://mak-auth.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://quickshop-api

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Disable Hibernate DDL auto so Flyway manages schema creation
spring.jpa.hibernate.ddl-auto=validate

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=user_mgmt
spring.flyway.create-schemas=true